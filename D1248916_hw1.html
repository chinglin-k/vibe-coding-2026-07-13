<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud Tasks · 我的任務（離線示範版）</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
/* ===== Design tokens ===== */
:root{
  --bg-deep:      #0a1120;
  --bg-deep-2:    #0d1730;
  --panel:        rgba(255,255,255,0.045);
  --panel-border: rgba(255,255,255,0.08);
  --panel-hi:     rgba(255,255,255,0.07);
  --text-hi:      #f3f5fb;
  --text-mid:     #aab3c8;
  --text-dim:     #6b7690;
  --accent-1:     #3b6bf0;
  --accent-2:     #6c5ce8;
  --accent-grad:  linear-gradient(135deg, var(--accent-1), var(--accent-2));
  --success:      #34d399;
  --danger:       #f87171;
  --gold:         #f6c453;

  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --font-display: "Plus Jakarta Sans", "Noto Sans TC", sans-serif;
  --font-body: "Noto Sans TC", "Plus Jakarta Sans", sans-serif;
}

*{ box-sizing: border-box; }

html, body{
  height: 100%;
  margin: 0;
}

body{
  font-family: var(--font-body);
  color: var(--text-hi);
  background: radial-gradient(120% 140% at 15% 0%, var(--bg-deep-2) 0%, var(--bg-deep) 55%, #060a15 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

/* ===== Stage / aurora signature background ===== */
.stage{
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

.aurora{
  position: absolute;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(38% 30% at 20% 15%, rgba(59,107,240,0.28), transparent 60%),
    radial-gradient(32% 26% at 85% 20%, rgba(108,92,232,0.22), transparent 60%),
    radial-gradient(30% 28% at 50% 90%, rgba(59,107,240,0.14), transparent 60%);
  filter: blur(40px);
  animation: aurora-drift 16s ease-in-out infinite alternate;
}

@keyframes aurora-drift{
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(2%, -3%) scale(1.06); }
}

/* ===== Card shell ===== */
.card{
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  background: linear-gradient(180deg, var(--panel-hi), var(--panel));
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-xl);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 30px 60px -25px rgba(0,0,0,0.6);
  padding: 28px;
  animation: card-rise 0.5s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes card-rise{
  from{ opacity:0; transform: translateY(14px) scale(.985); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}

/* ===== App icon ===== */
.app-icon{
  display:flex; align-items:center; justify-content:center;
  background: var(--accent-grad);
  border-radius: 16px;
  color: white;
  box-shadow: 0 10px 24px -8px rgba(59,107,240,0.55);
  flex-shrink: 0;
}
.app-icon--lg{ width: 72px; height:72px; border-radius: 22px; }
.app-icon--lg i{ width: 34px; height:34px; }
.app-icon--sm{ width: 40px; height:40px; }
.app-icon--sm i{ width: 20px; height:20px; }

/* ===== Onboarding view ===== */
.card--onboarding{ padding: 44px 32px; }
.onboarding-inner{ display:flex; flex-direction:column; align-items:center; text-align:center; gap: 6px; }
.onboarding-inner .app-icon{ margin-bottom: 18px; }

.onboarding-title{
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
}
.onboarding-sub{
  color: var(--text-mid);
  font-size: 14px;
  margin: 0 0 28px;
}

.btn-primary{
  width: 100%;
  display:flex; align-items:center; justify-content:center; gap:8px;
  background: var(--accent-grad);
  color: white;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  border: none;
  border-radius: var(--radius-md);
  padding: 15px 20px;
  cursor: pointer;
  box-shadow: 0 14px 28px -12px rgba(59,107,240,0.65);
  transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.btn-primary:hover{ transform: translateY(-1px); filter: brightness(1.06); }
.btn-primary:active{ transform: translateY(0px) scale(.99); }
.btn-primary .icon-16{ width:16px; height:16px; }
.btn-primary:disabled{ opacity:.6; cursor: default; transform:none; }

.onboarding-error{
  margin-top: 14px;
  font-size: 12.5px;
  color: var(--danger);
}

/* ===== Loading view ===== */
.card--loading{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 14px;
  padding: 60px 32px;
}
.loader{
  width: 28px; height:28px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--accent-1);
  animation: spin 0.8s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.loading-text{ color: var(--text-dim); font-size: 13px; margin:0; }

/* ===== Tasks view ===== */
.card--tasks{ padding: 24px; }

.tasks-header{
  display:flex; align-items:flex-start; justify-content:space-between;
  margin-bottom: 20px;
}
.tasks-header-left{ display:flex; align-items:center; gap: 12px; }

.tasks-title{
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 800;
  margin: 0 0 3px;
  letter-spacing: -0.01em;
}

.sync-row{ display:flex; align-items:center; gap:6px; }
.sync-dot{
  width:7px; height:7px; border-radius:50%;
  background: var(--success);
  box-shadow: 0 0 0 3px rgba(52,211,153,0.18);
  flex-shrink:0;
}
.sync-label{
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  font-family: var(--font-display);
  text-transform: uppercase;
}

.icon-btn{
  display:flex; align-items:center; justify-content:center;
  width: 36px; height:36px;
  border-radius: 10px;
  border: 1px solid var(--panel-border);
  background: rgba(255,255,255,0.03);
  color: var(--text-mid);
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.icon-btn:hover{ background: rgba(255,255,255,0.08); color: var(--text-hi); }
.icon-btn i{ width: 17px; height:17px; }

/* Stats card */
.stats-card{
  display:flex; align-items:center; justify-content:space-between;
  background: rgba(255,255,255,0.035);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 16px;
}
.stats-label{
  font-size: 12.5px;
  color: var(--text-dim);
  margin: 0 0 6px;
}
.stats-percent{
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.02em;
  transition: color .2s ease;
}

.progress-ring-wrap{ position: relative; width: 52px; height:52px; flex-shrink:0; }
.progress-ring{ width:52px; height:52px; transform: rotate(-90deg); }
.progress-ring-track{
  fill:none; stroke: rgba(255,255,255,0.08); stroke-width: 6;
}
.progress-ring-value{
  fill:none;
  stroke: var(--gold);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 169.6;
  stroke-dashoffset: 169.6;
  transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1);
}
.progress-ring-icon{
  position:absolute; inset:0; margin:auto;
  width:18px; height:18px;
  display:flex; align-items:center; justify-content:center;
  color: var(--text-dim);
}

/* Add row */
.add-row{ display:flex; gap: 10px; margin-bottom: 18px; }
.add-input{
  flex: 1;
  background: rgba(255,255,255,0.035);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-md);
  padding: 13px 16px;
  color: var(--text-hi);
  font-family: var(--font-body);
  font-size: 14.5px;
  outline: none;
  transition: border-color .15s ease, background .15s ease;
}
.add-input::placeholder{ color: var(--text-dim); }
.add-input:focus{ border-color: rgba(108,92,232,0.65); background: rgba(255,255,255,0.055); }

.add-btn{
  width: 46px; height:46px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border: none; border-radius: var(--radius-md);
  background: var(--accent-grad);
  color:white; cursor:pointer;
  box-shadow: 0 10px 20px -10px rgba(59,107,240,0.7);
  transition: transform .15s ease, filter .15s ease;
}
.add-btn:hover{ filter: brightness(1.08); transform: translateY(-1px); }
.add-btn:active{ transform: scale(.94); }
.add-btn i{ width:19px; height:19px; }

/* Task list */
.task-list{
  list-style: none;
  margin: 0; padding: 0;
  display:flex; flex-direction:column; gap: 8px;
  max-height: 340px;
  overflow-y: auto;
}
.task-list::-webkit-scrollbar{ width: 5px; }
.task-list::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius: 4px; }

.task-item{
  display:flex; align-items:center; gap: 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  animation: item-in .28s ease both;
}
@keyframes item-in{
  from{ opacity:0; transform: translateY(6px); }
  to{ opacity:1; transform: translateY(0); }
}

.task-check{
  width: 22px; height:22px; flex-shrink:0;
  border-radius: 7px;
  border: 1.5px solid var(--panel-border);
  background: transparent;
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  color: transparent;
  transition: background .15s ease, border-color .15s ease;
}
.task-check i{ width:14px; height:14px; }
.task-check.checked{
  background: var(--accent-grad);
  border-color: transparent;
  color: white;
}

.task-text{
  flex:1;
  font-size: 14px;
  color: var(--text-hi);
  word-break: break-word;
  transition: color .15s ease;
}
.task-text.completed{
  color: var(--text-dim);
  text-decoration: line-through;
}

.task-delete{
  width: 28px; height:28px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border:none; background:transparent;
  color: var(--text-dim);
  cursor:pointer;
  border-radius: 8px;
  opacity: 0;
  transition: opacity .15s ease, color .15s ease, background .15s ease;
}
.task-item:hover .task-delete{ opacity: 1; }
.task-delete:hover{ color: var(--danger); background: rgba(248,113,113,0.1); }
.task-delete i{ width:15px; height:15px; }

/* Empty state */
.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 14px;
  padding: 46px 10px 10px;
  text-align:center;
}
.empty-icon{
  width: 52px; height:52px;
  display:flex; align-items:center; justify-content:center;
  border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--panel-border);
  color: var(--text-dim);
  animation: float 3.2s ease-in-out infinite;
}
.empty-icon i{ width:24px; height:24px; }
@keyframes float{
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-6px); }
}
.empty-text{
  font-size: 13.5px;
  color: var(--text-dim);
  margin: 0;
}

/* Utility */
[hidden]{ display:none !important; }

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  .aurora, .empty-icon, .card, .task-item{ animation: none !important; }
}

/* Demo badge (僅離線示範版使用) */
.demo-badge{
  position: fixed;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  font-size: 11.5px;
  color: var(--text-dim);
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--panel-border);
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
}

/* Mobile */
@media (max-width: 460px){
  .card{ padding: 22px; border-radius: 22px; }
  .card--onboarding{ padding: 34px 22px; }
}

</style>
</head>
<body>

<div class="stage">
  <div class="aurora" aria-hidden="true"></div>

  <div class="demo-badge">離線示範版・無需 Firebase 設定・重新整理會清空資料</div>

  <!-- ========== 畫面一：啟動 / 登入 ========== -->
  <main id="view-onboarding" class="card card--onboarding" hidden>
    <div class="onboarding-inner">
      <div class="app-icon app-icon--lg">
        <i data-lucide="list-checks"></i>
      </div>
      <h1 class="onboarding-title">Cloud Tasks</h1>
      <p class="onboarding-sub">跨裝置即時同步，讓效率無所不在</p>

      <button id="btn-start" class="btn-primary">
        <span>立即開始使用</span>
        <i data-lucide="sparkles" class="icon-16"></i>
      </button>
      <p id="onboarding-error" class="onboarding-error" hidden></p>
    </div>
  </main>

  <!-- ========== 畫面二：我的任務 ========== -->
  <main id="view-tasks" class="card card--tasks" hidden>

    <header class="tasks-header">
      <div class="tasks-header-left">
        <div class="app-icon app-icon--sm">
          <i data-lucide="list-checks"></i>
        </div>
        <div>
          <h1 class="tasks-title">我的任務</h1>
          <div class="sync-row">
            <span class="sync-dot" aria-hidden="true"></span>
            <span id="sync-label" class="sync-label">SYNCED: ...</span>
          </div>
        </div>
      </div>
      <button id="btn-logout" class="icon-btn" title="登出" aria-label="登出">
        <i data-lucide="log-out"></i>
      </button>
    </header>

    <section class="stats-card">
      <div>
        <p class="stats-label">今日完成率</p>
        <p id="stats-percent" class="stats-percent">0%</p>
      </div>
      <div class="progress-ring-wrap">
        <svg class="progress-ring" viewBox="0 0 64 64">
          <circle class="progress-ring-track" cx="32" cy="32" r="27" />
          <circle id="progress-ring-value" class="progress-ring-value" cx="32" cy="32" r="27" />
        </svg>
        <i data-lucide="trophy" class="progress-ring-icon"></i>
      </div>
    </section>

    <form id="form-add" class="add-row" autocomplete="off">
      <input id="input-task" class="add-input" type="text" placeholder="輸入新任務..." maxlength="120" />
      <button type="submit" class="add-btn" aria-label="新增任務">
        <i data-lucide="plus"></i>
      </button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon">
        <i data-lucide="sparkles"></i>
      </div>
      <p class="empty-text">萬事俱備，只欠任務！</p>
    </div>

  </main>

  <!-- 讀取中畫面 -->
  <main id="view-loading" class="card card--loading">
    <div class="loader" aria-hidden="true"></div>
    <p class="loading-text">正在連線 Cloud Tasks...</p>
  </main>

</div>

<script>
/* ============================================================
   Cloud Tasks — app-demo.js（離線示範版）
   與正式版 app.js 邏輯結構一致，差別只在於：
     - 不連接 Firebase，登入用本機產生的假 uid 模擬
     - 資料存在記憶體變數（重新整理頁面即清空，這是示範版的預期行為）
   對應流程與正式版相同：
     A 進入首頁 → B 是否登入? → C 顯示待辦清單 / D 登入頁面 → C
     C → E 輸入事項並點擊新增 → F 儲存至資料庫(此處為記憶體) → 回到 C
   ============================================================ */

// ---- DOM refs ----
const viewLoading = document.getElementById("view-loading");
const viewOnboarding = document.getElementById("view-onboarding");
const viewTasks = document.getElementById("view-tasks");

const btnStart = document.getElementById("btn-start");
const btnLogout = document.getElementById("btn-logout");

const syncLabel = document.getElementById("sync-label");
const statsPercent = document.getElementById("stats-percent");
const progressRingValue = document.getElementById("progress-ring-value");

const formAdd = document.getElementById("form-add");
const inputTask = document.getElementById("input-task");
const taskListEl = document.getElementById("task-list");
const emptyState = document.getElementById("empty-state");

const RING_CIRCUMFERENCE = 2 * Math.PI * 27;

// ---- 模擬後端狀態（僅存在於記憶體中）----
let currentUser = null; // { uid }
let tasks = []; // { id, text, completed, createdAt }
let nextId = 1;

function showOnly(view) {
  [viewLoading, viewOnboarding, viewTasks].forEach((v) => (v.hidden = v !== view));
}
function refreshIcons() {
  if (window.lucide) lucide.createIcons();
}

// ============================================================
// A → B：進入首頁，判斷是否已登入（示範版預設為未登入）
// ============================================================
setTimeout(() => {
  if (currentUser) {
    enterTasksView();
  } else {
    showOnly(viewOnboarding);
    refreshIcons();
  }
}, 400); // 模擬連線判斷的短暫延遲，對應正式版等待 onAuthStateChanged 的體感

// ============================================================
// D：登入頁面 →（示範版）本機產生假 uid → C
// ============================================================
btnStart.addEventListener("click", () => {
  btnStart.disabled = true;
  btnStart.querySelector("span").textContent = "登入中...";
  setTimeout(() => {
    currentUser = { uid: "demo-" + Math.random().toString(36).slice(2, 10) };
    btnStart.disabled = false;
    btnStart.querySelector("span").textContent = "立即開始使用";
    enterTasksView();
  }, 350);
});

btnLogout.addEventListener("click", () => {
  currentUser = null;
  tasks = [];
  showOnly(viewOnboarding);
  refreshIcons();
});

// ============================================================
// C：顯示待辦清單
// ============================================================
function enterTasksView() {
  showOnly(viewTasks);
  refreshIcons();
  syncLabel.textContent = `SYNCED: ${currentUser.uid.slice(0, 8)}...`;
  renderAll();
}

function renderAll() {
  renderTasks();
  renderStats();
}

function renderTasks() {
  const sorted = [...tasks].sort((a, b) => b.createdAt - a.createdAt);
  taskListEl.innerHTML = "";

  if (sorted.length === 0) {
    emptyState.hidden = false;
    refreshIcons();
    return;
  }
  emptyState.hidden = true;

  const frag = document.createDocumentFragment();
  sorted.forEach((task) => {
    const li = document.createElement("li");
    li.className = "task-item";
    li.innerHTML = `
      <button class="task-check ${task.completed ? "checked" : ""}" data-id="${task.id}" aria-label="切換完成狀態">
        ${task.completed ? '<i data-lucide="check"></i>' : ""}
      </button>
      <span class="task-text ${task.completed ? "completed" : ""}">${escapeHtml(task.text)}</span>
      <button class="task-delete" data-id="${task.id}" aria-label="刪除任務">
        <i data-lucide="trash-2"></i>
      </button>
    `;
    frag.appendChild(li);
  });
  taskListEl.appendChild(frag);
  refreshIcons();
}

function renderStats() {
  const todayKey = new Date().toDateString();
  const todayTasks = tasks.filter((t) => new Date(t.createdAt).toDateString() === todayKey);
  const total = todayTasks.length;
  const done = todayTasks.filter((t) => t.completed).length;
  const percent = total === 0 ? 0 : Math.round((done / total) * 100);

  statsPercent.textContent = `${percent}%`;
  progressRingValue.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - percent / 100));
}

// ============================================================
// C → E → F：輸入事項並新增 → 存入記憶體 → 回到 C
// ============================================================
formAdd.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputTask.value.trim();
  if (!text) return;
  inputTask.value = "";

  tasks.push({
    id: String(nextId++),
    text,
    completed: false,
    createdAt: Date.now(),
  });
  renderAll();
});

taskListEl.addEventListener("click", (e) => {
  const checkBtn = e.target.closest(".task-check");
  const delBtn = e.target.closest(".task-delete");

  if (checkBtn) {
    const id = checkBtn.dataset.id;
    tasks = tasks.map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
    renderAll();
  }
  if (delBtn) {
    const id = delBtn.dataset.id;
    tasks = tasks.filter((t) => t.id !== id);
    renderAll();
  }
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

refreshIcons();

</script>
</body>
</html>
